name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and run the tests
        run: ./mvnw --batch-mode verify

      - name: Keep the jars for the deploy job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: margosha-jars
          path: |
            app/node/target/margosha.jar
            app/ycsb-binding/target/margosha-ycsb-binding.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-learner-lab
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      VPC_STACK: margosha-vpc
      APP_STACK: margosha-app
      JAR: app/node/target/margosha.jar
      BINDING_JAR: app/ycsb-binding/target/margosha-ycsb-binding.jar
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The artifact keeps the paths below app/, so both jars land where the build put them.
      - name: Get the tested jars
        uses: actions/download-artifact@v4
        with:
          name: margosha-jars
          path: app

      - name: Use the Learner Lab session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Check the credentials
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::The AWS credentials were rejected. The lab session has probably ended: start the lab and refresh the AWS_* secrets (README, 'Deploy pipeline')."
            exit 1
          fi

      - name: Deploy the network stack (margosha-vpc)
        run: |
          aws cloudformation deploy \
            --stack-name "$VPC_STACK" \
            --template-file cfn/margosha-vpc-stack.yaml \
            --no-fail-on-empty-changeset | tee vpc-deploy.log
          echo "- \`$VPC_STACK\`: $(tail -n 1 vpc-deploy.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the current node instance IDs
        run: |
          ids=$(aws cloudformation describe-stacks --stack-name "$APP_STACK" \
            --query "Stacks[0].Outputs[?ends_with(OutputKey, 'InstanceId') && OutputKey!='BenchClientInstanceId'].OutputValue" \
            --output text 2>/dev/null || true)
          echo "Nodes before the deploy: ${ids:-none (new stack)}"
          echo "NODES_BEFORE=$ids" >> "$GITHUB_ENV"
          # Log lines older than this (minus 60 s for clock differences) belong to boots before this deploy.
          echo "SINCE=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Deploy the application stack (margosha-app)
        run: |
          aws cloudformation deploy \
            --stack-name "$APP_STACK" \
            --template-file cfn/margosha-app.yaml \
            --no-fail-on-empty-changeset | tee app-deploy.log
          echo "- \`$APP_STACK\`: $(tail -n 1 app-deploy.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the jars
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$APP_STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out ArtifactsBucketName)
          HASH=$(sha256sum "$JAR" | cut -c1-16)
          aws s3 cp "$JAR" "s3://$BUCKET/releases/margosha.jar" --only-show-errors
          echo "Uploaded $JAR to s3://$BUCKET/releases/margosha.jar, sha256 $HASH"
          echo "- jar: \`s3://$BUCKET/releases/margosha.jar\`, sha256 \`$HASH\` (commit \`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
          BINDING_HASH=$(sha256sum "$BINDING_JAR" | cut -c1-16)
          aws s3 cp "$BINDING_JAR" "s3://$BUCKET/releases/margosha-ycsb-binding.jar" --only-show-errors
          echo "Uploaded $BINDING_JAR to s3://$BUCKET/releases/margosha-ycsb-binding.jar, sha256 $BINDING_HASH"
          echo "- YCSB binding: \`s3://$BUCKET/releases/margosha-ycsb-binding.jar\`, sha256 \`$BINDING_HASH\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "JAR_HASH=$HASH"
            echo "COORD=$(out CoordinatorInstanceId)"
            echo "SHARD_A=$(out ShardAInstanceId)"
            echo "SHARD_B=$(out ShardBInstanceId)"
          } >> "$GITHUB_ENV"

      - name: Reboot the coordinator and the shards
        run: |
          reboot=()
          for id in "$COORD" "$SHARD_A" "$SHARD_B"; do
            if [[ "$NODES_BEFORE" == *"$id"* ]]; then
              state=$(aws ec2 describe-instances --instance-ids "$id" --query "Reservations[0].Instances[0].State.Name" --output text)
              if [ "$state" = "stopped" ]; then
                echo "$id is stopped: starting it (a start downloads the jar too)"
                aws ec2 start-instances --instance-ids "$id" > /dev/null
              else
                reboot+=("$id")
              fi
            else
              echo "$id was just created: it gets the jar on its first boot, not rebooted"
            fi
          done
          if [ ${#reboot[@]} -gt 0 ]; then
            echo "Rebooting ${reboot[*]}"
            aws ec2 reboot-instances --instance-ids "${reboot[@]}"
          fi

      - name: Wait for the nodes to start the new jar
        timeout-minutes: 15
        run: |
          console() { aws ec2 get-console-output --instance-id "$1" --latest --output text 2>/dev/null || true; }
          # Times of the lines matching $1 that were logged after $SINCE (Spring logs UTC, e.g. 2026-10-30T12:00:00.123Z).
          since() { grep -E "$1" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}' | awk -v s="$SINCE" '$0 >= s'; }
          deadline=$(( $(date +%s) + 12 * 60 ))
          give_up() {
            echo "::error::$1 within 12 minutes. Last log lines of $2:"
            console "$2" | grep -E 'margosha|WARN|ERROR|Exception' | tail -n 20
            exit 1
          }

          for id in "$COORD" "$SHARD_A" "$SHARD_B"; do
            until
              log=$(console "$id")
              [[ "$log" == *"sha256 $JAR_HASH"* ]] && [ -n "$(since 'Running as' <<< "$log")" ]
            do
              [ "$(date +%s)" -lt "$deadline" ] || give_up "$id did not download and start the jar with sha256 $JAR_HASH" "$id"
              echo "$id: new jar not downloaded or not started yet, checking again in 20 s"
              sleep 20
            done
            echo "$id: runs the jar with sha256 $JAR_HASH (started at $(since 'Running as' <<< "$log" | tail -n 1) UTC)"
          done

          until
            log=$(console "$COORD")
            [ -n "$(since '(Registered|Updated) shard shard-a ' <<< "$log")" ] && [ -n "$(since '(Registered|Updated) shard shard-b ' <<< "$log")" ]
          do
            [ "$(date +%s)" -lt "$deadline" ] || give_up "The coordinator did not register both shards" "$COORD"
            echo "coordinator: waiting for shard-a and shard-b to register, checking again in 15 s"
            sleep 15
          done
          echo "coordinator: shard-a and shard-b registered"
          echo "- nodes \`$COORD\` (coordinator), \`$SHARD_A\`, \`$SHARD_B\` started the new jar; shard-a and shard-b registered with the coordinator" >> "$GITHUB_STEP_SUMMARY"
