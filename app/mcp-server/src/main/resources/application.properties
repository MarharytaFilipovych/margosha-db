spring.application.name=margosha-mcp

spring.main.web-application-type=none
spring.main.banner-mode=off
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.name=margosha-db
spring.ai.mcp.server.version=0.1.0

spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.completion=false

logging.structured.json.exclude=@version,level_value

margosha.mcp.coordinator-url=${MCP_COORDINATOR_URL:http://localhost:8080}
# how long one call may take
margosha.mcp.timeout=${MCP_TIMEOUT:5s}
