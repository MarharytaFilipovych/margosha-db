openapi: 3.0.3
info:
  title: Margosha DB API
  version: 0.3.0
  description: |
    API of the Margosha DB coordinator (ADR 0004), and the internal API of its replicas.
    Clients register tables and do CRUD over records (plus EXISTS).
    Replicas register themselves with the coordinator when they start, and again every 10 s.

    Keys and attribute values are strings.
    A table has a partition key and, optionally, a sort key.
    The sort key value is sent as the `sortKey` query parameter.

    Replication (M3, ADRs 0007-0011): each shard is a replica set of a leader and followers (N = 3).
    The coordinator sends CREATE / UPDATE / DELETE to the owning shard's leader, which answers only after
    W replicas (itself included) stored the write. READ and EXISTS go to R replicas of the shard, and the
    answer with the highest version wins. The client API below does not change.

    A 503 on a write means its outcome is unknown: the leader may have stored it without enough follower
    confirmations, and it may become visible later. Read the record to find out.

    Replicas serve the record operations under the same record path, called by the coordinator.
    Replicas don't keep table definitions: they have no `POST /tables` and don't return `TABLE_NOT_FOUND`.
    The coordinator checks the table and the keys before it forwards a request to a replica.

    Because a replica does not know which attributes are the key, the coordinator always sends the key
    in the path (`/tables/{tableName}/records/{partitionKey}?sortKey=...`) and only the non-key
    attributes in the body (the `Attributes` schema). On a replica:
    - CREATE is `POST` on the record path (not on `/records`), body `Attributes`, answer 201 with the attributes.
    - READ returns a `ReplicaRecord`: the stored `Attributes` (without the key attributes) and their version.
      A deleted record, or one the replica never received, is 404 `RECORD_NOT_FOUND` with `version` in the
      error: the delete's version, or 0.
    - EXISTS returns a `ReplicaExists`: `exists` and the version of the key's last write (0 if never written).
    - UPDATE returns the stored `Attributes`; DELETE is the same as on the coordinator.
    - Only the leader takes writes; a follower answers 421 `NOT_LEADER`. A write the followers did not
      confirm in time is 503 `SHARD_UNAVAILABLE` (outcome unknown).
    - Errors: `RECORD_NOT_FOUND` (404), `RECORD_ALREADY_EXISTS` (409), `VALIDATION_ERROR` (400),
      `NOT_LEADER` (421), `SHARD_UNAVAILABLE` (503).

tags:
  - name: tables
  - name: records
  - name: shards
  - name: replication
    description: Internal API between replicas (ADR 0008) and for checks; not called by clients.

paths:
  /tables:
    post:
      tags: [tables]
      operationId: registerTable
      summary: Register a table definition
      description: |
        Registers a table with its partition key and optional sort key.
        Registering a name that already exists fails with 409, and the existing table is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinition'
            examples:
              partitionKeyOnly:
                value: { name: users, partitionKey: user_id }
              withSortKey:
                value: { name: orders, partitionKey: customer_id, sortKey: order_id }
      responses:
        '201':
          description: Table registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tables/{tableName}/records:
    parameters:
      - $ref: '#/components/parameters/TableName'
    post:
      tags: [records]
      operationId: createRecord
      summary: CREATE a record
      description: |
        Stores a new record. The body holds the key attributes and the other attributes.
        Fails with 409 if a record with this primary key already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Record'
            example: { user_id: '42', name: Anna, city: Kyiv }
      responses:
        '201':
          description: Record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ShardUnavailable'

  /tables/{tableName}/records/{partitionKey}:
    parameters:
      - $ref: '#/components/parameters/TableName'
      - $ref: '#/components/parameters/PartitionKey'
      - $ref: '#/components/parameters/SortKey'
    get:
      tags: [records]
      operationId: readRecord
      summary: READ a record
      responses:
        '200':
          description: The record with all its attributes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example: { user_id: '42', name: Anna, city: Kyiv }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ShardUnavailable'
    put:
      tags: [records]
      operationId: updateRecord
      summary: UPDATE a record
      description: |
        Replaces all non-key attributes of an existing record with the given ones.
        The key comes from the path; the body must not contain the key attributes.
        Fails with 404 if the record does not exist (no record is created).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attributes'
            example: { name: Bob }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example: { user_id: '42', name: Bob }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ShardUnavailable'
    delete:
      tags: [records]
      operationId: deleteRecord
      summary: DELETE a record
      description: Fails with 404 if the table or the record does not exist.
      responses:
        '204':
          description: Record deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ShardUnavailable'

  /tables/{tableName}/records/{partitionKey}/exists:
    parameters:
      - $ref: '#/components/parameters/TableName'
      - $ref: '#/components/parameters/PartitionKey'
      - $ref: '#/components/parameters/SortKey'
    get:
      tags: [records]
      operationId: recordExists
      summary: EXISTS - check whether a record exists
      description: |
        Returns whether a record is stored under the key, without returning the record.
        A missing record is not an error: the answer is `false`.
        404 means only that the table does not exist.
      responses:
        '200':
          description: Whether the record exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResult'
              examples:
                present:
                  value: { exists: true }
                absent:
                  value: { exists: false }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ShardUnavailable'

  /shards:
    post:
      tags: [shards]
      operationId: registerShard
      summary: Register a replica of a shard
      description: |
        Called by each replica when it starts, and again at a fixed interval, so a restarted coordinator
        gets its replicas back. A shard joins the ring when its first replica registers.
        Registering again with the same details changes nothing; with a new address or role, the replica's
        entry is replaced. A second, different leader for a shard is rejected (400), and the registered
        leader is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShardRegistration'
            examples:
              leader:
                value: { shardId: shard-a, replicaId: shard-a-1, role: leader, address: 'http://10.0.1.15:8080' }
              follower:
                value: { shardId: shard-a, replicaId: shard-a-2, role: follower, address: 'http://10.0.2.20:8080' }
      responses:
        '200':
          description: Replica registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShardRegistration'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /replication/log:
    get:
      tags: [replication]
      operationId: fetchLog
      summary: A follower fetches the leader's log entries after its position (leader only)
      description: |
        Long-polling (ADR 0008): when there is no entry after `after`, the leader holds the request until one
        arrives or the long-poll time passes (5 s by default), then answers with no entries.
        `after` is the last entry the follower stored, so it is also its confirmation of every entry up to it
        (ADR 0011). A follower answers 421 `NOT_LEADER`.
      parameters:
        - name: after
          in: query
          required: true
          description: The follower's position, the version of the last entry it stored (0 when its log is empty).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: follower
          in: query
          required: true
          description: The follower's replica ID.
          schema:
            type: string
            minLength: 1
        - name: max
          in: query
          required: false
          description: At most this many entries in the answer.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: The entries after `after`, in log order (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicationBatch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '421':
          $ref: '#/components/responses/NotLeader'
        '500':
          $ref: '#/components/responses/InternalError'

  /replication/status:
    get:
      tags: [replication]
      operationId: replicaStatus
      summary: What a replica reports about itself
      responses:
        '200':
          description: The replica's role, position, its followers' confirmed positions (leader) and counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaStatus'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TableName:
      name: tableName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PartitionKey:
      name: partitionKey
      in: path
      required: true
      description: Value of the table's partition key.
      schema:
        type: string
        minLength: 1
    SortKey:
      name: sortKey
      in: query
      required: false
      description: |
        Value of the table's sort key.
        Required for a table that has a sort key; must not be sent for a table without one (400).
      schema:
        type: string
        minLength: 1

  schemas:
    TableDefinition:
      type: object
      required: [name, partitionKey]
      properties:
        name:
          type: string
          minLength: 1
          description: Table name.
        partitionKey:
          type: string
          minLength: 1
          description: Name of the partition key attribute.
        sortKey:
          type: string
          minLength: 1
          description: Name of the sort key attribute (optional).
      additionalProperties: false

    Attributes:
      type: object
      description: Named attributes with string values.
      additionalProperties:
        type: string

    Record:
      type: object
      description: |
        A record: the key attributes (partition key and, if the table has one, sort key)
        and the other attributes. All values are strings; key values must not be empty.
      additionalProperties:
        type: string

    ExistsResult:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: Whether a record is stored under the given key.
      additionalProperties: false

    ShardRegistration:
      type: object
      required: [shardId, replicaId, role, address]
      properties:
        shardId:
          type: string
          minLength: 1
          description: Fixed ID of the shard, for example shard-a. Its ring positions are computed from it (ADR 0005).
        replicaId:
          type: string
          minLength: 1
          description: Fixed ID of this replica, for example shard-a-2.
        role:
          $ref: '#/components/schemas/ReplicaRole'
        address:
          type: string
          minLength: 1
          description: Base URL the replica serves on.
      additionalProperties: false

    ReplicaRole:
      type: string
      enum: [leader, follower]
      description: The replica's fixed role in its shard's replica set (no failover in M3).

    ReplicaRecord:
      type: object
      description: A replica's answer to READ.
      required: [attributes, version]
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        version:
          type: integer
          format: int64
          description: Version of the write that set these attributes (its position in the shard's log).
      additionalProperties: false

    ReplicaExists:
      type: object
      description: A replica's answer to EXISTS.
      required: [exists, version]
      properties:
        exists:
          type: boolean
        version:
          type: integer
          format: int64
          description: Version of the key's last write, a delete included; 0 when the replica never received one.
      additionalProperties: false

    ReplicationEntry:
      type: object
      description: One entry of the leader's log, the result of a write (ADRs 0009, 0010).
      required: [version, table, partitionKey, deleted]
      properties:
        version:
          type: integer
          format: int64
          description: The entry's position in the shard's log, which is the record's new version.
        table:
          type: string
        partitionKey:
          type: string
        sortKey:
          type: string
          description: Only for tables with a sort key.
        attributes:
          $ref: '#/components/schemas/Attributes'
        deleted:
          type: boolean
          description: True for a delete (a tombstone); it then has no attributes.
      additionalProperties: false

    ReplicationBatch:
      type: object
      required: [entries, leaderLastVersion]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReplicationEntry'
        leaderLastVersion:
          type: integer
          format: int64
          description: The leader's last entry, to see how far behind the follower is.
      additionalProperties: false

    ReplicaStatus:
      type: object
      required: [shardId, replicaId, role, lastVersion, followerPositions, readsServed, entriesReceived]
      properties:
        shardId:
          type: string
        replicaId:
          type: string
        role:
          $ref: '#/components/schemas/ReplicaRole'
        lastVersion:
          type: integer
          format: int64
          description: The last entry in the replica's log, which is its position.
        followerPositions:
          type: object
          description: On a leader, the position each follower last confirmed, by replica ID; empty on a follower.
          additionalProperties:
            type: integer
            format: int64
        readsServed:
          type: integer
          format: int64
          description: READ and EXISTS requests answered since the replica started.
        entriesReceived:
          type: integer
          format: int64
          description: On a follower, log entries received from the leader since it started; 0 on a leader.
      additionalProperties: false

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - TABLE_NOT_FOUND
            - RECORD_NOT_FOUND
            - TABLE_ALREADY_EXISTS
            - RECORD_ALREADY_EXISTS
            - INTERNAL_ERROR
            - SHARD_UNAVAILABLE
            - NOT_LEADER
        message:
          type: string
        version:
          type: integer
          format: int64
          description: |
            Only in a replica's 404 for READ: the version it holds for the key (the delete's version, or 0 when
            it never received a write for it). Never sent to clients of the coordinator.
      additionalProperties: false

  responses:
    ValidationError:
      description: |
        The request is invalid, for example an empty table name, a missing key attribute,
        a missing or unexpected sort key, or a non-string value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: VALIDATION_ERROR, message: 'Missing value for sort key order_id' }
    NotFound:
      description: The table or the record does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: TABLE_NOT_FOUND, message: 'Table ghost does not exist' }
    TableNotFound:
      description: The table does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: TABLE_NOT_FOUND, message: 'Table ghost does not exist' }
    Conflict:
      description: The table or the record already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: RECORD_ALREADY_EXISTS, message: 'Record user_id=42 already exists' }
    InternalError:
      description: An unexpected error in the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: INTERNAL_ERROR, message: 'Unexpected server error' }
    ShardUnavailable:
      description: |
        Sharded mode only: no shard is registered; for a write, the owning shard has no registered leader,
        its leader did not answer within the timeout, or W replicas did not store the write in time; for a read,
        fewer than R replicas of the owning shard answered. The request is not sent to another shard.
        On a write, the outcome is unknown: the leader may have stored it, and it may become visible later.
        Read the record before retrying; a retried CREATE can get 409 for the client's own record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            leaderDown:
              value: { code: SHARD_UNAVAILABLE, message: 'Replica shard-b-1 of shard shard-b did not answer' }
            writeNotConfirmed:
              value: { code: SHARD_UNAVAILABLE, message: 'Write 57 was stored by the leader but not confirmed by 1 follower(s) in time; its outcome is unknown' }
            readQuorum:
              value: { code: SHARD_UNAVAILABLE, message: 'Only 1 of the 2 replicas a read needs answered for shard shard-b' }
    NotLeader:
      description: Replicas only. This replica is a follower; writes and the log go to the shard's leader.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { code: NOT_LEADER, message: "Replica shard-a-2 is a follower of shard shard-a; send this to the shard's leader" }
