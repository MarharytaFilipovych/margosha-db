spring.application.name=node

# Coordinator (sharded mode): how long to wait for a shard before answering SHARD_UNAVAILABLE.
margosha.shard.timeout=2s

# Shard: how long one registration attempt may wait for the coordinator before it counts as failed.
margosha.shard.register-timeout=2s

# Shard: pause before the first registration retry; it doubles after each failed attempt, up to the maximum.
# Attempts never stop: a shard that gave up would run without getting any keys.
margosha.shard.register-retry-interval=2s
margosha.shard.register-retry-max-interval=30s

# Shard: after it is registered, register again this often. The coordinator keeps the shard list only in memory,
# so a restarted coordinator gets its shards back within this time.
margosha.shard.register-refresh-interval=10s

# Replication (ADR 0007): N replicas per shard, W of them must store a write before it is confirmed, R are asked per
# read. Every node refuses to start unless W and R are between 1 and N and R + W > N.
margosha.replication.factor=3
margosha.replication.write-quorum=2
margosha.replication.read-quorum=2

# Leader: how long a write waits for W - 1 follower confirmations before answering 503, outcome unknown (ADR 0011).
# Keep it shorter than margosha.shard.timeout, so the coordinator gets the leader's own answer.
margosha.replication.ack-timeout=1s

# Leader: how long a follower's fetch is held when there is nothing new (long-polling, ADR 0008).
margosha.replication.long-poll=5s

# Follower: at most this many entries per fetch; when the leader can't be reached, retry after the interval, which
# doubles after each failed attempt, up to the maximum.
margosha.replication.fetch-max-entries=500
margosha.replication.retry-interval=500ms
margosha.replication.retry-max-interval=5s

# Replica: the folder that holds its replication log (ADR 0009).
margosha.data-dir=data

# Replica: its role in the shard's replica set, leader or follower. A follower also needs margosha.replica.leader-url.
margosha.replica.role=leader
margosha.replica.id=${margosha.shard.id}
