# Fixed fields on every log line of a replica: its role (leader or follower), its shard and its own ID.
logging.structured.json.add.role=${margosha.replica.role}
logging.structured.json.add.shard=${margosha.shard.id}
logging.structured.json.add.replica=${margosha.replica.id}

# The same as tags on every metric.
management.metrics.tags.role=${margosha.replica.role}
management.metrics.tags.shard=${margosha.shard.id}
management.metrics.tags.replica=${margosha.replica.id}
