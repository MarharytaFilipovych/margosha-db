# Fixed fields on every log line of the coordinator.
logging.structured.json.add.role=coordinator

# The same as tags on every metric.
management.metrics.tags.role=coordinator

# On AWS, the stack writes /etc/margosha/stack.env (BUCKET, PORT, REGION, DATA_DIR) on every node. The coordinator
# reads it, and its REGION turns on sending metrics to CloudWatch, with the replicas' metrics relayed.
# The file doesn't exist on a laptop or in tests, so nothing is sent there.
spring.config.import=optional:file:/etc/margosha/stack.env[.properties]
margosha.metrics.cloudwatch.region=${REGION:}

# a request with the X-Agent-Key header (from the MCP server) may only create, read, check and delete
# records in these tables. To allow more tables, add them here (comma-separated) and deploy.
margosha.agent.allowed-tables=agent_notes
# On AWS (REGION set) the key is read from this SSM parameter when the coordinator starts; the pipeline saves it
# there from the MARGOSHA_AGENT_KEY secret. Elsewhere, pass --margosha.agent.key=<key>. Without a key, every agent
# request is refused with 401, and requests without the header work as before.
margosha.agent.region=${REGION:}
margosha.agent.key-parameter=/margosha/agent-key
